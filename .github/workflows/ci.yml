name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-linux:
    # Кросплатформна частина мови (усе, крім GUI/2D/3D-графіки на
    # Windows Forms) — саме те, що реально перевіряє tests/run_all.sh:
    # graphics/http_server-тести там пропускаються на будь-якій ОС.
    runs-on: ubuntu-latest
    # Справжні БД для tests/test_postgres.nx і tests/test_mysql.nx (драйвери
    # lib/postgres.nx, lib/mysql.nx - чиста NyxilumLang поверх tcp*). Живуть
    # лише на час job. Postgres 16 - SCRAM-SHA-256 за замовчуванням; MySQL
    # 8.4 - caching_sha2_password, перший вхід через TLS (?ssl=true).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nxpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nxpass
          MYSQL_DATABASE: nxtest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnxpass --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          path: NyxilumLang

      # NyxilumLang.csproj посилається на NyxilumDb (сестринський репозиторій)
      # через ProjectReference з ВІДНОСНИМ шляхом "../../../NyxilumDb/...",
      # розрахованим на те, що обидва репо лежать поруч на диску (як у
      # локального розробника). Явний path: на ОБОХ checkout-кроках —
      # єдиний спосіб відтворити це на раннері: тоді обидва репо стають
      # справжніми сусідами під $GITHUB_WORKSPACE, а не одне вкладене в
      # інше (звідси "../../../" рахує рівно 3 рівні вгору коректно).
      - uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumDb
          path: NyxilumDb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # EnableWindowsTargeting потрібен навіть для збірки лише net10.0:
      # csproj мультитаргетить net10.0-windows;net10.0, і без цього
      # прапорця restore падає на "To build a project targeting Windows
      # on this operating system, set the EnableWindowsTargeting property
      # to true" ще до того, як дійде до конкретного -f net10.0.
      - name: Build (net10.0)
        working-directory: NyxilumLang
        run: dotnet build src/NyxilumLang -f net10.0 -p:EnableWindowsTargeting=true --configuration Release

      - name: Run test suite
        working-directory: NyxilumLang
        # Абсолютний шлях обов'язковий: run_all.sh сам робить cd у tests/
        # перед тим, як перевірити $NX_EXE — відносний шлях звідти вже
        # вказував би не туди.
        env:
          NX_TEST_PG_URL: postgres://postgres:nxpass@127.0.0.1:5432/postgres
          NX_TEST_MYSQL_URL: mysql://root:nxpass@127.0.0.1:3306/nxtest?ssl=true
        run: NX_EXE="$(pwd)/src/NyxilumLang/bin/Release/net10.0/Nx" bash tests/run_all.sh

      # Нативні бекенди: кожен tests/native/*.nx виконується у VM, у x86-
      # і ARM64-бінарнику (останній - через qemu-aarch64), вивід і код
      # виходу мають збігатися побайтово. as/ld для i386 уже є на раннері.
      - name: Install ARM64 toolchain
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu qemu-user

      - name: Run native backend tests (VM = x86 = ARM64)
        working-directory: NyxilumLang
        run: NX="$(pwd)/src/NyxilumLang/bin/Release/net10.0/Nx" bash tests/native/run_native.sh

  build-windows:
    # Окрема перевірка, що WinForms-гілка (#if WINDOWS: guiWindow,
    # createCanvas тощо) досі компілюється — run_all.sh її не зачіпає,
    # бо ці тести пропускаються на всіх ОС однаково.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: NyxilumLang

      - uses: actions/checkout@v4
        with:
          repository: Faneraiy14/NyxilumDb
          path: NyxilumDb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (net10.0-windows)
        working-directory: NyxilumLang
        run: dotnet build src/NyxilumLang -f net10.0-windows --configuration Release
